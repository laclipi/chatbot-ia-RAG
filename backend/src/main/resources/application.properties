
# Nombre de la aplicación Spring Boot
spring.application.name=chatbot-ia

# Conexión a PostgreSQL en el entorno local
spring.datasource.url=jdbc:postgresql://localhost:5433/chatbot_ia
spring.datasource.username=chatbot
spring.datasource.password=dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea o actualiza las tablas durante el desarrollo
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola para facilitar el aprendizaje
spring.jpa.show-sql=true

# Clave secreta para firmar los tokens JWT; se obtiene del entorno.
jwt.secret=${JWT_SECRET}
# Duración del token de acceso: 30 minutos.
jwt.expiration-ms=1800000

# Muestra la cadena de filtros y ayuda a diagnosticar la autenticación.
logging.level.org.springframework.security=TRACE
logging.level.com.laura.chatbot_ia.security=DEBUG