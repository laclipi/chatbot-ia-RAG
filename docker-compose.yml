services:
  postgres:
    image: postgres:17-alpine
    container_name: chatbot-ia-postgres
    environment:
      POSTGRES_DB: chatbot_ia
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot_ia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
