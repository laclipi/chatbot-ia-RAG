$kind: http-request
description: |-
  Inicia sesión con la misma cuenta que Register User.
  Guarda accessToken para que el resto de la colección herede el Bearer.
  Una contraseña incorrecta responde HTTP 401 con ApiError.
url: '{{baseUrl}}/api/auth/login'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{userEmail}}",
      "password": "{{userPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Guarda el JWT de la colección", function () {
          const body = pm.response.json();
          pm.expect(body.tokenType).to.eql("Bearer");
          pm.expect(body.accessToken).to.be.a("string").and.not.empty;
          pm.collectionVariables.set("accessToken", body.accessToken);
      });
order: 2000
