$kind: http-request
description: |-
  Consulta el negocio guardado en {{businessId}}.
  Create business actualiza esa variable. El valor inicial es 1.
  Espera HTTP 200 si el usuario autenticado pertenece a ese negocio.
url: '{{baseUrl}}/api/businesses/:id'
method: GET
order: 2000
pathVariables:
  - key: id
    value: '{{businessId}}'
    description: Identificador guardado por Create business. El valor inicial de la colección es 1.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Devuelve el negocio solicitado", function () {
          const body = pm.response.json();
          pm.expect(body.id).to.eql(Number(pm.collectionVariables.get("businessId")));
          pm.expect(body.name).to.be.a("string").and.not.empty;
          pm.expect(body).to.have.property("contactEmail");
          pm.expect(body).to.have.property("phoneNumber");
          pm.expect(body.active).to.be.a("boolean");
      });
