$kind: http-request
description: |-
  Crea una reserva en {{businessId}} para el servicio {{offeredServiceId}}.
  Hereda el Bearer de la colección. Antes de enviar, calcula una fecha
  siete días por delante para cumplir la validación de fecha futura.
  Guarda appointmentId para confirmar y cancelar esa misma reserva.
url: '{{baseUrl}}/api/businesses/{{businessId}}/appointments'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "offeredServiceId": {{offeredServiceId}},
      "customerName": "Laura Test",
      "customerEmail": "laura.test@example.com",
      "customerPhone": "600123456",
      "startAt": "{{appointmentStartAt}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const start = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);
      const local = new Date(start.getTime() - start.getTimezoneOffset() * 60000);
      pm.collectionVariables.set("appointmentStartAt", local.toISOString().slice(0, 19));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 201 Created", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Guarda la reserva creada", function () {
          const body = pm.response.json();
          pm.expect(body.id).to.be.a("number");
          pm.expect(body.status).to.eql("PENDING");
          pm.collectionVariables.set("appointmentId", String(body.id));
      });
order: 1000
