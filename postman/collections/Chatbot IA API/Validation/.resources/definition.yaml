$kind: collection
name: Validation
description: |-
  Casos rechazados por la API. No crean ni modifican datos cuando la validación responde antes de guardar.
  Los HTTP 400 de cuerpo usan ApiError: timestamp, status, error, message y path.
  El mensaje es solo el primer error de validación.
  Un negocio ajeno, exista o no, responde 403 porque la pertenencia se comprueba antes.
  Los HTTP 404 de un servicio inexistente dentro de un negocio propio sí llevan ApiError.
order: 5000
