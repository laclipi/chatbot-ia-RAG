$kind: http-request
description: |-
  Consulta un negocio al que el usuario no pertenece.
  La pertenencia se comprueba antes, así que el id 99 responde HTTP 403
  con ApiError y no revela si ese negocio existe.
url: '{{baseUrl}}/api/businesses/:id'
method: GET
order: 4000
pathVariables:
  - key: id
    value: '99'
    description: Identificador de un negocio al que esta cuenta no pertenece.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 403 sin pertenencia", function () {
          pm.response.to.have.status(403);
          const body = pm.response.json();
          pm.expect(body.status).to.eql(403);
          pm.expect(body.error).to.eql("Forbidden");
          pm.expect(body.message).to.eql("No perteneces a ese negocio");
          pm.expect(body.path).to.eql("/api/businesses/99");
          pm.expect(body).to.have.property("timestamp");
      });
