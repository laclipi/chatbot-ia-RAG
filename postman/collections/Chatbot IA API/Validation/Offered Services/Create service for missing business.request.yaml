$kind: http-request
description: |-
  Intenta crear un servicio en un negocio al que el usuario no pertenece.
  La validación del cuerpo pasa y la pertenencia responde HTTP 403.
  No se guarda el servicio.
url: '{{baseUrl}}/api/businesses/:businessId/services'
method: POST
order: 4000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: businessId
    value: '99'
    description: Identificador de un negocio al que esta cuenta no pertenece.
body:
  type: json
  content: |-
    {
      "name": "Consulta inicial",
      "description": "Primera consulta",
      "price": 35.00,
      "durationMinutes": 30
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 403 sin pertenencia", function () {
          pm.response.to.have.status(403);
          const body = pm.response.json();
          pm.expect(body.status).to.eql(403);
          pm.expect(body.error).to.eql("Forbidden");
          pm.expect(body.message).to.eql("No perteneces a ese negocio");
          pm.expect(body.path).to.eql("/api/businesses/99/services");
          pm.expect(body).to.have.property("timestamp");
      });
