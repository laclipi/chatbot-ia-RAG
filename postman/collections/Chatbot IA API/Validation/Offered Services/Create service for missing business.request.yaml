$kind: http-request
description: |-
  Intenta crear un servicio valido para un negocio que no existe.
  La validación del cuerpo pasa y el gestor responde HTTP 404.
  El negocio 99 no debe existir. No se guarda el servicio.
url: '{{baseUrl}}/api/businesses/:businessId/services'
method: POST
order: 4000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: businessId
    value: '99'
    description: Identificador de un negocio que no debe existir.
body:
  type: json
  content: |-
    {
      "name": "Consulta inicial",
      "description": "Primera consulta",
      "price": 35.00,
      "durationMinutes": 30
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 404 y negocio inexistente", function () {
          pm.response.to.have.status(404);
          const body = pm.response.json();
          pm.expect(body.status).to.eql(404);
          pm.expect(body.error).to.eql("Not Found");
          pm.expect(body.message).to.eql("No existe un negocio con ID 99");
          pm.expect(body.path).to.eql("/api/businesses/99/services");
          pm.expect(body).to.have.property("timestamp");
      });
