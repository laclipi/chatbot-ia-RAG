$kind: http-request
description: |-
  Rechaza un nombre de servicio de 151 caracteres. El máximo es 150.
  Espera HTTP 400 y el mensaje "El nombre no puede superar los 150 caracteres".
url: '{{baseUrl}}/api/businesses/:businessId/services'
method: POST
order: 10000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: businessId
    value: '1'
    description: Identificador de ruta. La validación del cuerpo ocurre antes de usarlo.
body:
  type: json
  content: |-
    {
      "name": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
      "price": 35.00,
      "durationMinutes": 30
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 400 y nombre demasiado largo", function () {
          pm.response.to.have.status(400);
          const body = pm.response.json();
          pm.expect(body.status).to.eql(400);
          pm.expect(body.error).to.eql("Bad Request");
          pm.expect(body.message).to.eql("El nombre no puede superar los 150 caracteres");
          pm.expect(body.path).to.eql("/api/businesses/1/services");
          pm.expect(body).to.have.property("timestamp");
      });