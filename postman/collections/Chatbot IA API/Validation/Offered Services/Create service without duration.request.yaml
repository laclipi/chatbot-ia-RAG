$kind: http-request
description: |-
  Rechaza un alta sin duracion. El campo es obligatorio.
  Espera HTTP 400 y el mensaje "La duración es obligatoria".
url: '{{baseUrl}}/api/businesses/:businessId/services'
method: POST
order: 9000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: businessId
    value: '1'
    description: Identificador de ruta. La validación del cuerpo ocurre antes de usarlo.
body:
  type: json
  content: |-
    {
      "name": "Consulta inicial",
      "description": "Primera consulta",
      "price": 35.00
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 400 y duracion ausente", function () {
          pm.response.to.have.status(400);
          const body = pm.response.json();
          pm.expect(body.status).to.eql(400);
          pm.expect(body.error).to.eql("Bad Request");
          pm.expect(body.message).to.eql("La duración es obligatoria");
          pm.expect(body.path).to.eql("/api/businesses/1/services");
          pm.expect(body).to.have.property("timestamp");
      });
