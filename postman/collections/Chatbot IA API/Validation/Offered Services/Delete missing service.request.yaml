$kind: http-request
description: |-
  Elimina un servicio que no existe en el negocio.
  Espera HTTP 404 con ApiError y no borra nada.
  El negocio 1 debe existir y el servicio 99 no debe pertenecerle.
url: '{{baseUrl}}/api/businesses/:businessId/services/:serviceId'
method: DELETE
order: 15000
pathVariables:
  - key: businessId
    value: '1'
    description: Negocio que debe existir para llegar a la comprobacion del servicio.
  - key: serviceId
    value: '99'
    description: Servicio que no debe existir en ese negocio.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 404 y servicio inexistente", function () {
          pm.response.to.have.status(404);
          const body = pm.response.json();
          pm.expect(body.status).to.eql(404);
          pm.expect(body.error).to.eql("Not Found");
          pm.expect(body.message).to.eql("No existe un servicio con ID 99 para el negocio con ID 1");
          pm.expect(body.path).to.eql("/api/businesses/1/services/99");
          pm.expect(body).to.have.property("timestamp");
      });
