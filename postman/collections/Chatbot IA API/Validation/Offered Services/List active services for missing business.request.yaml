$kind: http-request
description: |-
  Lista servicios activos de un negocio al que el usuario no pertenece.
  La pertenencia se comprueba antes, así que el id 99 responde HTTP 403.
  El path incluye /active.
url: '{{baseUrl}}/api/businesses/:businessId/services/active'
method: GET
order: 2000
pathVariables:
  - key: businessId
    value: '99'
    description: Identificador de un negocio al que esta cuenta no pertenece.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 403 sin pertenencia", function () {
          pm.response.to.have.status(403);
          const body = pm.response.json();
          pm.expect(body.status).to.eql(403);
          pm.expect(body.error).to.eql("Forbidden");
          pm.expect(body.message).to.eql("No perteneces a ese negocio");
          pm.expect(body.path).to.eql("/api/businesses/99/services/active");
          pm.expect(body).to.have.property("timestamp");
      });
