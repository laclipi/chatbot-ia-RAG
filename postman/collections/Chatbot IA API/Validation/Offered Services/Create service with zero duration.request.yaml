$kind: http-request
description: |-
  Rechaza una duracion de 0 minutos. El minimo es 1.
  Espera HTTP 400 y el mensaje "La duración debe ser de al menos 1 minuto".
url: '{{baseUrl}}/api/businesses/:businessId/services'
method: POST
order: 7000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: businessId
    value: '1'
    description: Identificador de ruta. La validación del cuerpo ocurre antes de usarlo.
body:
  type: json
  content: |-
    {
      "name": "Consulta inicial",
      "description": "Primera consulta",
      "price": 35.00,
      "durationMinutes": 0
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 400 y duracion cero", function () {
          pm.response.to.have.status(400);
          const body = pm.response.json();
          pm.expect(body.status).to.eql(400);
          pm.expect(body.error).to.eql("Bad Request");
          pm.expect(body.message).to.eql("La duración debe ser de al menos 1 minuto");
          pm.expect(body.path).to.eql("/api/businesses/1/services");
          pm.expect(body).to.have.property("timestamp");
      });
