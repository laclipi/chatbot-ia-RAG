$kind: http-request
description: |-
  Cambia el estado de un servicio que no existe.
  El parámetro active está presente, así que la peticion llega al gestor.
  Espera HTTP 404. El negocio 1 debe existir y el servicio 99 no debe pertenecerle.
url: '{{baseUrl}}/api/businesses/:businessId/services/:serviceId/active?active=false'
method: PATCH
order: 16000
pathVariables:
  - key: businessId
    value: '1'
    description: Negocio que debe existir para llegar a la comprobacion del servicio.
  - key: serviceId
    value: '99'
    description: Servicio que no debe existir en ese negocio.
queryParams:
  - key: active
    value: 'false'
    description: Valor booleano valido. El rechazo viene de no encontrar el servicio.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 404 y servicio inexistente", function () {
          pm.response.to.have.status(404);
          const body = pm.response.json();
          pm.expect(body.status).to.eql(404);
          pm.expect(body.error).to.eql("Not Found");
          pm.expect(body.message).to.eql("No existe un servicio con ID 99 para el negocio con ID 1");
          pm.expect(body.path).to.eql("/api/businesses/1/services/99/active");
          pm.expect(body).to.have.property("timestamp");
      });
